name: Clean Stellar Kraal issue 94 patch

on:
  push:
    branches:
      - validation/stellar-kraal-94

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/stellar-kraal-94
          fetch-depth: 0

      - name: Check out validated upstream commit
        uses: actions/checkout@v4
        with:
          repository: Stellar-kraal/stellar-kraal-contract
          ref: cca5f033318f43cb9b18060d161873d75df58381
          path: upstream
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt

      - name: Apply validated patch without lockfile noise
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git apply ../validation/stellar-kraal-94/stellar-kraal-94.patch
          git checkout -- Cargo.lock
          cd ..
          python - <<'PY'
          from pathlib import Path

          manifest = Path("upstream/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          nested_workspace = '    "contracts/carbon_credit/fuzz",\n'
          if text.count(nested_workspace) != 1:
              raise SystemExit("expected nested fuzz workspace member once")
          manifest.write_text(text.replace(nested_workspace, "", 1), encoding="utf-8")
          PY
          cd upstream
          cargo fmt -p stellarkraal
          cargo fmt -p stellarkraal -- --check
          cargo test -p stellarkraal
          cargo clippy -p stellarkraal --all-targets -- -D warnings
          cargo build --release --target wasm32-unknown-unknown -p stellarkraal

      - name: Replace artifact with clean validated diff
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout -- Cargo.toml Cargo.lock
          git add -N .
          git diff --binary --no-ext-diff > ../stellar-kraal-94.patch
          git status --short > ../stellar-kraal-94-status.txt
          cd ..

          mv -f stellar-kraal-94.patch validation/stellar-kraal-94/
          mv -f stellar-kraal-94-status.txt validation/stellar-kraal-94/
          cat > validation/stellar-kraal-94/VALIDATION.md <<'EOF'
          # Stellar Kraal issue #94 validation

          Upstream commit: `cca5f033318f43cb9b18060d161873d75df58381`

          Validated in GitHub Actions:

          - `cargo fmt -p stellarkraal -- --check` — PASS
          - `cargo test -p stellarkraal` — PASS
          - `cargo clippy -p stellarkraal --all-targets -- -D warnings` — PASS
          - release WASM build — PASS

          The clean patch changes only the `stellarkraal` contract, lifecycle
          regression, and Soroban snapshots. Temporary workspace and lockfile
          changes used to validate the upstream checkout are excluded.
          EOF

          rm -f .github/workflows/clean-stellar-kraal-94-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: clean validated Stellar Kraal issue 94 patch"
          git push origin HEAD:validation/stellar-kraal-94
