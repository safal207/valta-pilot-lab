name: Opt-in site

on:
  pull_request:
    paths:
      - "site/**"
      - "sales/**"
      - "scripts/validate_site.py"
      - ".github/workflows/optin-site.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "sales/**"
      - "scripts/validate_site.py"
      - ".github/workflows/optin-site.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after GitHub Pages is enabled and PAGES_ENABLED=true"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: optin-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static site and public downloads
        run: python scripts/validate_site.py
      - name: Compile validation script
        run: python -m py_compile scripts/validate_site.py

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload validated static-site bundle
        uses: actions/upload-artifact@v4
        with:
          name: ambiguous-payment-recovery-site
          path: site
          if-no-files-found: error
          retention-days: 30

  pages-notice:
    if: >-
      github.event_name != 'pull_request' &&
      vars.PAGES_ENABLED != 'true'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Explain one-time Pages bootstrap
        run: |
          echo "::notice title=GitHub Pages bootstrap required::The validated site is available as the ambiguous-payment-recovery-site workflow artifact. Enable Pages with Source: GitHub Actions, then set the repository Actions variable PAGES_ENABLED=true and rerun this workflow with deploy=true."

  deploy:
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: [validate, package]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
