name: Opt-in site

on:
  pull_request:
    paths:
      - "site/**"
      - "sales/**"
      - "scripts/validate_site.py"
      - ".github/workflows/optin-site.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "sales/**"
      - "scripts/validate_site.py"
      - ".github/workflows/optin-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static site and public downloads
        run: python scripts/validate_site.py
      - name: Compile validation script
        run: python -m py_compile scripts/validate_site.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
