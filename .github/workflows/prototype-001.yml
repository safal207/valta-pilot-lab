name: Prototype 001 verify_action

on:
  push:
    paths:
      - 'prototypes/verify_action/**'
      - '.github/workflows/prototype-001.yml'
  pull_request:
    paths:
      - 'prototypes/verify_action/**'
      - '.github/workflows/prototype-001.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic policy and lifecycle tests
        working-directory: prototypes/verify_action
        run: python -m unittest -v test_valta_verify.py test_action_lifecycle.py
      - name: Run decision demo
        working-directory: prototypes/verify_action
        run: python demo.py
      - name: Run durable lifecycle demo
        working-directory: prototypes/verify_action
        run: |
          python lifecycle_demo.py > /tmp/verified-transition-receipt.json
          python -m json.tool /tmp/verified-transition-receipt.json > /dev/null
      - name: Compile prototype
        run: python -m compileall prototypes/verify_action
