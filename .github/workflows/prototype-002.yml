name: Prototype 002 MCP

on:
  pull_request:
    paths:
      - "prototypes/verify_action/**"
      - ".github/workflows/prototype-002.yml"
  push:
    branches: [main]
    paths:
      - "prototypes/verify_action/**"
      - ".github/workflows/prototype-002.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP dependency
        run: python -m pip install -r prototypes/verify_action/requirements-mcp.txt
      - name: Run tests
        run: python -m unittest discover -s prototypes/verify_action -p "test_*.py" -v
      - name: Compile prototype
        run: python -m compileall prototypes/verify_action
